[workspace]
members = ["contracts/agent-wallet", "contracts/coverage-vault", "contracts/reserve-pool", "contracts/manual-demo-factory"]
default-members = ["contracts/agent-wallet", "contracts/coverage-vault", "contracts/reserve-pool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
near-sdk = "5.30.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
